[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Optional. The site URL defaults to https://gallery-hartaf.netlify.app.
  # SITE_URL = "https://gallery-hartaf.netlify.app"

[[redirects]]
  from = "/works"
  to = "/paintings"
  status = 301

[[redirects]]
  from = "/works/series/*"
  to = "/paintings/series/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
