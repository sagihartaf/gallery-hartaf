[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public origin for canonical links, Open Graph, JSON-LD, and the sitemap.
  SITE_URL = "https://hrtf.co.il"

[[redirects]]
  from = "/works"
  to = "/paintings"
  status = 301

[[redirects]]
  from = "/works/series/*"
  to = "/paintings/series/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
